<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!--Pyscript-->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />

    <!--Style-css-->

<body>
    <!--Header-->
     <header><h1>🍰 OBMC Entrep Fair - Dessert Delights</h1></header>

        <p>Menu:</p>

        <a href="http://127.0.0.1:3000/ICT%20PROJECT/Receipt-Generator/index.html?vscode-livepreview=true">Go to Receipt-Generator</a>
